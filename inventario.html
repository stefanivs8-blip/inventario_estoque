<meta charset="UTF-8">
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventário · Portocel</title>
  <link rel="stylesheet" href="css/portocel.css">
</head>

<script src="js/logo.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/github.js"></script>  
<body>

<div id="loading" class="loading-overlay" style="display:none">
  <div class="spinner"></div>
  <div class="loading-text">Salvando inventário...</div>
</div>

<header class="site-header">
  <div class="logo"><img id="header-logo" src="" alt="Portocel"></div>
  <button class="nav-toggle" id="nav-toggle">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
  </button>
  <nav>
    <a href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>Início</a>
    <a href="inventario.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12l2 2 4-4"/></svg>Inventário</a>
    <a href="historico.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>Histórico</a>
    <a href="estoque.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 7H4a2 2 0 00-2 2v10a2 2 0 002 2h16a2 2 0 002-2V9a2 2 0 00-2-2z"/><path d="M16 3H8l-2 4h12l-2-4z"/></svg>Estoque</a>
  </nav>
</header>

<div class="page-wrap">

  <!-- STEP 1: IDENTIFICAÇÃO -->
  <div id="step-1">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px">
      <a href="index.html" class="btn btn-ghost btn-sm">← Voltar</a>
      <h2 style="font-size:18px;font-weight:700;color:var(--azul)">Novo Inventário</h2>
    </div>

    <div class="card">
      <div class="card-header">
        <div class="card-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.58-7 8-7s8 3 8 7"/></svg>
          Identificação
        </div>
      </div>
      <div class="grid-2">
        <div class="field"><label>Data</label><input type="text" id="inv-data" readonly></div>
        <div class="field"><label>Horário</label><input type="text" id="inv-hora" readonly></div>
      </div>
      <div class="field">
        <label>Colaborador</label>
        <select id="inv-colab" onchange="onSelectColab()">
          <option value="">— Selecione —</option>
        </select>
      </div>
      <div id="turno-row" style="display:none">
        <div class="grid-2">
          <div class="field">
            <label>Turno</label>
            <div style="padding:8px 0"><span class="turno-tag" id="turno-label">—</span></div>
          </div>
          <div class="field"><label>Horário do turno</label><input type="text" id="inv-turno-hora" readonly></div>
        </div>
      </div>
      <div style="display:flex;justify-content:flex-end;margin-top:8px">
        <button class="btn btn-primary" id="btn-step1" onclick="goStep(2)" disabled>
          Iniciar Contagem
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- STEP 2: CONTAGEM -->
  <div id="step-2" style="display:none">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">
      <button class="btn btn-ghost btn-sm" onclick="goStep(1)">← Voltar</button>
      <h2 style="font-size:18px;font-weight:700;color:var(--azul)">Contagem de Itens</h2>
    </div>

    <!-- Progresso -->
    <div class="card" style="padding:16px 20px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <span style="font-size:13px;font-weight:600;color:var(--azul)" id="prog-label">0 de 29 itens</span>
        <span style="font-size:12px;color:#888" id="prog-pct">0%</span>
      </div>
      <div class="progress"><div class="progress-fill" id="prog-fill" style="width:0%"></div></div>
    </div>

    <!-- Filtro rápido -->
    <div class="card" style="padding:12px 16px;margin-bottom:0">
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <span style="font-size:12px;font-weight:600;color:#888">Filtrar:</span>
        <button class="btn btn-ghost btn-sm filter-btn active" data-filter="all"   onclick="setFilter('all')">Todos</button>
        <button class="btn btn-ghost btn-sm filter-btn"        data-filter="crit"  onclick="setFilter('crit')">⚠ Críticos</button>
        <button class="btn btn-ghost btn-sm filter-btn"        data-filter="epi"   onclick="setFilter('epi')">EPI</button>
        <button class="btn btn-ghost btn-sm filter-btn"        data-filter="oper"  onclick="setFilter('oper')">Operacional</button>
      </div>
    </div>

    <div id="itens-lista" style="margin-top:10px"></div>

    <div class="card" style="margin-top:4px">
      <button class="btn btn-primary btn-full btn-lg" onclick="goStep(3)">
        Concluir e Assinar
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3a2.828 2.828 0 114 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>
      </button>
    </div>
  </div>

  <!-- STEP 3: ASSINATURA -->
  <div id="step-3" style="display:none">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">
      <button class="btn btn-ghost btn-sm" onclick="goStep(2)">← Voltar</button>
      <h2 style="font-size:18px;font-weight:700;color:var(--azul)">Assinatura</h2>
    </div>

    <div class="card">
      <div class="card-title" style="margin-bottom:16px">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3a2.828 2.828 0 114 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>
        Confirmação do Responsável
      </div>
      <div class="field">
        <label>Número de Matrícula</label>
        <input type="text" id="matricula" placeholder="Digite sua matrícula">
      </div>
      <div class="field">
        <label>Assinatura</label>
        <canvas id="sig-canvas"></canvas>
        <div style="display:flex;gap:8px;margin-top:8px;align-items:center">
          <button class="btn btn-ghost btn-sm" onclick="sig.clear()">Limpar</button>
          <span style="font-size:11px;color:#aaa">Assine com o dedo ou mouse</span>
        </div>
      </div>
      <div style="display:flex;justify-content:flex-end;margin-top:8px">
        <button class="btn btn-primary" onclick="goStep(4)">
          Ver Resumo
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- STEP 4: RESUMO E ENVIO -->
  <div id="step-4" style="display:none">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">
      <button class="btn btn-ghost btn-sm" onclick="goStep(3)">← Voltar</button>
      <h2 style="font-size:18px;font-weight:700;color:var(--azul)">Resumo e Envio</h2>
    </div>
    <div id="resumo-content"></div>
  </div>

</div>

<div id="toast"></div>

<script src="js/logo.js"></script>
<script src="js/github.js"></script>
<script src="js/utils.js"></script>
<script>
let inv = { colab:'', turno:'', turnoHora:'', data:'', hora:'', counts:{}, photos:{}, matricula:'', sigData:'' };
let sig = null;
let currentFilter = 'all';
let currentPhotoId = null;

document.addEventListener('DOMContentLoaded', async () => {
  document.getElementById('header-logo').src = PORTOCEL_LOGO;
  initNavToggle();

  if (!GH.isConfigured()) { location.href = 'index.html'; return; }

  showLoading('Carregando...');
  try { await APP.carregar(); } catch(e) { showToast('Erro: ' + e.message, 'error'); }
  finally { hideLoading(); }

  const now = new Date();
  document.getElementById('inv-data').value = now.toLocaleDateString('pt-BR');
  document.getElementById('inv-hora').value = now.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
  inv.data = now.toLocaleDateString('pt-BR');
  inv.hora = now.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
  inv.timestamp = now.toISOString();

  const sel = document.getElementById('inv-colab');
  APP.estoque.equipe.forEach(e => {
    sel.innerHTML += `<option value="${e.nome}">${e.nome} (Turno ${e.turno})</option>`;
  });

  // Init counts
  APP.estoque.items.forEach(i => { inv.counts[i.id] = i.qty; });
});

function onSelectColab() {
  const val = document.getElementById('inv-colab').value;
  const btn = document.getElementById('btn-step1');
  if (!val) { document.getElementById('turno-row').style.display='none'; btn.disabled=true; return; }
  const e = APP.estoque.equipe.find(x => x.nome === val);
  if (!e) return;
  inv.colab = e.nome; inv.turno = e.turno;
  const t = getTurnoAtual();
  inv.turnoHora = t.label;
  document.getElementById('turno-label').textContent = `Turno ${e.turno}`;
  document.getElementById('inv-turno-hora').value = t.label;
  document.getElementById('turno-row').style.display = '';
  btn.disabled = false;
}

function goStep(n) {
  [1,2,3,4].forEach(i => document.getElementById(`step-${i}`).style.display = (i===n?'':'none'));
  if (n === 2) renderItens();
  if (n === 3) { setTimeout(() => { sig = initSignature('sig-canvas'); }, 100); }
  if (n === 4) { inv.matricula = document.getElementById('matricula').value; inv.sigData = sig?.getData() || ''; renderResumo(); }
  window.scrollTo({top: 0, behavior: 'smooth'});
}

function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.filter === f));
  renderItens();
}

function renderItens() {
  const items = APP.estoque.items;
  let filtered = items;
  if (currentFilter === 'crit') filtered = items.filter(i => i.min && inv.counts[i.id] < i.min);
  else if (currentFilter === 'epi') filtered = items.filter(i => i.cat.toLowerCase() === 'epi');
  else if (currentFilter === 'oper') filtered = items.filter(i => i.cat.toLowerCase() === 'operacional');

  const total = items.length;
  const pct = Math.round(total > 0 ? 100 : 0);
  document.getElementById('prog-label').textContent = `${total} de ${total} itens`;
  document.getElementById('prog-pct').textContent = '100%';
  document.getElementById('prog-fill').style.width = '100%';

  document.getElementById('itens-lista').innerHTML = filtered.map(item => {
    const qty = inv.counts[item.id];
    const s = item.min && qty < item.min ? 'crit' : '';
    const ck = catKey(item.cat);
    const hasPhoto = inv.photos[item.id];
    return `
    <div class="item-card ${s ? 'status-'+s : ''}" id="ic-${item.id}">
      <div class="item-card-header">
        <span class="item-card-name">${item.name}</span>
        <span class="badge badge-${ck}">${item.cat}</span>
      </div>
      <div class="item-card-body">
        <div class="qty-ctrl">
          <button class="qty-btn" onclick="adjInv(${item.id},-1)">−</button>
          <span class="qty-num" id="qn-${item.id}">${qty}</span>
          <button class="qty-btn" onclick="adjInv(${item.id},1)">+</button>
        </div>
        <span class="qty-min">${item.min ? 'mín: '+item.min : ''}</span>
        <button class="btn btn-ghost btn-sm" onclick="triggerPhoto(${item.id})" style="font-size:12px">
          📷 ${hasPhoto ? 'Trocar' : 'Foto'}
        </button>
        ${hasPhoto ? '<span style="font-size:12px;color:var(--success);font-weight:700">✓ foto</span>' : ''}
      </div>
    </div>`;
  }).join('');
}

function adjInv(id, d) {
  inv.counts[id] = Math.max(0, (inv.counts[id] || 0) + d);
  document.getElementById('qn-' + id).textContent = inv.counts[id];
  const item = APP.estoque.items.find(i => i.id === id);
  const card = document.getElementById('ic-' + id);
  const isCrit = item.min && inv.counts[id] < item.min;
  card.className = 'item-card' + (isCrit ? ' status-crit' : '');
}

function triggerPhoto(id) {
  currentPhotoId = id;
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'image/*';
  input.onchange = e => {
    const f = e.target.files[0];
    if (!f) return;
    inv.photos[currentPhotoId] = { name: f.name, url: URL.createObjectURL(f) };
    renderItens();
  };
  input.click();
}

function renderResumo() {
  const items = APP.estoque.items;
  const abaixo = items.filter(i => i.min && inv.counts[i.id] < i.min);
  const ok     = items.filter(i => !i.min || inv.counts[i.id] >= i.min);
  const emails = APP.estoque.emails || [];

  const waText = abaixo.length
    ? `📦 *PEDIDO DE COMPRA NECESSÁRIO*\n*Data:* ${inv.data} · *Turno ${inv.turno}* (${inv.turnoHora})\n*Realizado por:* ${inv.colab}${inv.matricula?' · Matrícula: '+inv.matricula:''}\n\nOs itens abaixo necessitam de pedido de compra:\n\n` + abaixo.map(i => `• *${i.name}* — Estoque atual: ${inv.counts[i.id]} (mín: ${i.min})`).join('\n')
    : `✅ *INVENTÁRIO CONCLUÍDO*\n*Data:* ${inv.data} · *Turno ${inv.turno}* (${inv.turnoHora})\n*Realizado por:* ${inv.colab}${inv.matricula?' · Matrícula: '+inv.matricula:''}\n\nTodos os itens estão dentro do estoque mínimo.`;

  const emailTo   = emails.map(e => e.email).join(',');
  const emailSubj = encodeURIComponent(`Inventário ${inv.data} - Turno ${inv.turno} - ${inv.colab}`);
  const emailBody = encodeURIComponent(
    `Inventário: ${inv.data} às ${inv.hora}\nColaborador: ${inv.colab} | Turno ${inv.turno} (${inv.turnoHora})${inv.matricula?'\nMatrícula: '+inv.matricula:''}\n\n` +
    (abaixo.length ? `ITENS ABAIXO DO MÍNIMO:\n` + abaixo.map(i => `- ${i.name}: ${inv.counts[i.id]} (mín: ${i.min})`).join('\n') + '\n\n' : 'Todos os itens dentro do mínimo.\n\n') +
    `LISTA COMPLETA:\n` + items.map(i => `- ${i.name}: ${inv.counts[i.id]}`).join('\n')
  );

  document.getElementById('resumo-content').innerHTML = `
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:20px">
      <div class="metric"><div class="metric-label">Total</div><div class="metric-val">${items.length}</div></div>
      <div class="metric"><div class="metric-label">Normal</div><div class="metric-val success">${ok.length}</div></div>
      <div class="metric"><div class="metric-label">Abaixo mín.</div><div class="metric-val ${abaixo.length?'danger':'success'}">${abaixo.length}</div></div>
      <div class="metric"><div class="metric-label">Fotos</div><div class="metric-val">${Object.keys(inv.photos).length}</div></div>
    </div>

    ${abaixo.length
      ? `<div class="alert alert-danger"><strong>⚠ ${abaixo.length} item(s) abaixo do mínimo:</strong><br>${abaixo.map(i=>`• ${i.name}: ${inv.counts[i.id]} (mín: ${i.min})`).join('<br>')}</div>`
      : `<div class="alert alert-success"><strong>✓ Todos os itens dentro do estoque mínimo.</strong></div>`}

    ${inv.matricula || inv.sigData ? `
    <div class="card">
      <div class="card-title" style="margin-bottom:14px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px"><path d="M17 3a2.828 2.828 0 114 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>Assinatura</div>
      ${inv.matricula ? `<p style="font-size:13px;margin-bottom:10px"><strong>Matrícula:</strong> ${inv.matricula}</p>` : ''}
      ${inv.sigData ? `<img src="${inv.sigData}" style="max-width:100%;border:1.5px solid var(--cinza-med);border-radius:8px">` : ''}
    </div>` : ''}

    <div class="card">
      <div class="card-title" style="margin-bottom:12px">📱 WhatsApp</div>
      <div class="wa-box" id="wa-text">${waText}</div>
      <button class="btn btn-teal btn-full" onclick="copyWA()">📋 Copiar texto para WhatsApp</button>
    </div>

    <div class="card">
      <div class="card-title" style="margin-bottom:12px">✉️ E-mail</div>
      <p style="font-size:12px;color:#888;margin-bottom:10px">Destinatários:</p>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px">
        ${emails.map(e=>`<span style="background:var(--cinza);border-radius:20px;padding:4px 12px;font-size:11px;font-weight:600;color:#555" title="${e.email}">${e.nome}</span>`).join('')}
      </div>
      <a href="mailto:${emailTo}?subject=${emailSubj}&body=${emailBody}" style="text-decoration:none">
        <button class="btn btn-primary btn-full">✉️ Abrir e-mail com relatório</button>
      </a>
    </div>

    <div class="card">
      <div class="card-title" style="margin-bottom:8px">💾 Salvar Inventário</div>
      <p style="font-size:13px;color:#888;margin-bottom:16px">Salva no GitHub e atualiza o estoque atual.</p>
      <div id="save-error" class="alert alert-danger" style="display:none"></div>
      <button class="btn btn-success btn-full btn-lg" onclick="salvar()" id="btn-salvar">
        ✓ Salvar e Atualizar Estoque
      </button>
    </div>
  `;
}

function copyWA() {
  const txt = document.getElementById('wa-text').textContent;
  navigator.clipboard?.writeText(txt).then(() => showToast('Copiado!', 'success')).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = txt; document.body.appendChild(ta); ta.select(); document.execCommand('copy');
    document.body.removeChild(ta); showToast('Copiado!', 'success');
  });
}

async function salvar() {
  const btn = document.getElementById('btn-salvar');
  btn.disabled = true;
  showLoading('Salvando no GitHub...');

  // Update stock quantities
  APP.estoque.items.forEach(i => { i.qty = inv.counts[i.id] ?? i.qty; });

  const abaixo = APP.estoque.items.filter(i => i.min && i.qty < i.min);

  const registro = {
    id: Date.now(),
    timestamp: inv.timestamp || new Date().toISOString(),
    data: inv.data,
    hora: inv.hora,
    colaborador: inv.colab,
    turno: inv.turno,
    turnoHora: inv.turnoHora,
    matricula: inv.matricula,
    assinatura: inv.sigData,
    abaixoMinimo: abaixo.map(i => ({ id: i.id, name: i.name, qty: inv.counts[i.id], min: i.min })),
    snapshot: APP.estoque.items.map(i => ({ id: i.id, name: i.name, qty: inv.counts[i.id] }))
  };

  try {
    await APP.salvarTudo(registro);
    hideLoading();
    showToast('Inventário salvo com sucesso!', 'success');
    setTimeout(() => { location.href = 'index.html'; }, 1500);
  } catch (e) {
    hideLoading();
    btn.disabled = false;
    document.getElementById('save-error').textContent = 'Erro ao salvar: ' + e.message;
    document.getElementById('save-error').style.display = 'block';
    showToast('Erro ao salvar', 'error');
  }
}
</script>
</body>
</html>
