<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventário · Portocel</title>
    <link rel="stylesheet" href="css/portocel.css">
</head>
<body>

<div id="loading" class="loading-overlay" style="display:none">
  <div class="spinner"></div>
  <div class="loading-text">Salvando inventário...</div>
</div>

<header class="site-header">
  <div class="logo">
    <img id="header-logo" src="" alt="Portocel" style="height: 65px; width: auto; padding: 5px 0; display: block;">
  </div>
  <button class="nav-toggle" id="nav-toggle">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
  </button>
  <nav>
    <a href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>Início</a>
    <a href="inventario.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12l2 2 4-4"/></svg>Inventário</a>
    <a href="historico.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>Histórico</a>
    <a href="estoque.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 7H4a2 2 0 00-2 2v10a2 2 0 002 2h16a2 2 0 002-2V9a2 2 0 00-2-2z"/><path d="M16 3H8l-2 4h12l-2-4z"/></svg>Estoque</a>
  </nav>
</header>

<div class="page-wrap">

  <div id="step-1">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px">
      <a href="index.html" class="btn btn-ghost btn-sm">← Voltar</a>
      <h2 style="font-size:18px;font-weight:700;color:var(--azul)">Novo Inventário</h2>
    </div>

    <div class="card">
      <div class="card-header">
        <div class="card-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.58-7 8-7s8 3 8 7"/></svg>
          Identificação
        </div>
      </div>
      <div class="grid-2">
        <div class="field"><label>Data</label><input type="text" id="inv-data" readonly></div>
        <div class="field"><label>Horário</label><input type="text" id="inv-hora" readonly></div>
      </div>
      <div class="field">
        <label>Colaborador</label>
        <select id="inv-colab" onchange="onSelectColab()">
          <option value="">— Selecione —</option>
        </select>
      </div>
      <div id="turno-row" style="display:none">
        <div class="grid-2">
          <div class="field">
            <label>Equipe</label>
            <div style="padding:8px 0"><span class="turno-tag" id="turno-label">—</span></div>
          </div>
          <div class="field">
            <label>Turno Operacional</label>
            <input type="text" id="inv-turno-hora" readonly>
          </div>
        </div>
      </div>
      <div style="display:flex;justify-content:flex-end;margin-top:8px">
        <button class="btn btn-primary" id="btn-step1" onclick="goStep(2)" disabled>
          Iniciar Contagem
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
      </div>
    </div>
  </div>

  <div id="step-2" style="display:none">
    <div id="itens-lista" style="margin-top:10px"></div>
    <div class="card" style="margin-top:10px">
      <button class="btn btn-primary btn-full btn-lg" onclick="goStep(3)">Concluir e Assinar</button>
    </div>
  </div>

  <div id="step-3" style="display:none">
    <div class="card">
      <div class="field">
        <label>Número de Matrícula</label>
        <input type="text" id="matricula" placeholder="Digite sua matrícula">
      </div>
      <div class="field">
        <label>Assinatura</label>
        <canvas id="sig-canvas" style="border:1px solid #ccc; width:100%; height:150px;"></canvas>
        <button class="btn btn-ghost btn-sm" onclick="sig.clear()" style="margin-top:5px">Limpar</button>
      </div>
      <button class="btn btn-primary btn-full" onclick="goStep(4)">Ver Resumo</button>
    </div>
  </div>

  <div id="step-4" style="display:none">
    <div id="resumo-content"></div>
  </div>

</div>

<script src="js/logo.js"></script>
<script src="js/github.js"></script>
<script src="js/utils.js"></script>
<script>
let inv = { colab:'', turno:'', turnoHora:'', data:'', hora:'', counts:{}, matricula:'', sigData:'' };
let sig = null;

document.addEventListener('DOMContentLoaded', async () => {
  document.getElementById('header-logo').src = PORTOCEL_LOGO;
  
  const now = new Date();
  document.getElementById('inv-data').value = now.toLocaleDateString('pt-BR');
  document.getElementById('inv-hora').value = now.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
  inv.data = now.toLocaleDateString('pt-BR');
  inv.hora = now.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});

  if (typeof APP !== 'undefined') await APP.carregar();

  const sel = document.getElementById('inv-colab');
  if (APP.estoque && APP.estoque.equipe) {
      APP.estoque.equipe.forEach(e => {
        sel.innerHTML += `<option value="${e.nome}">${e.nome} (Equipe ${e.turno})</option>`;
      });
  }
  
  if (APP.estoque && APP.estoque.items) {
      APP.estoque.items.forEach(i => { inv.counts[i.id] = i.qty; });
  }
});

// LÓGICA DE TURNOS SOLICITADA: 07x19 e 19x07
function getTurnoAtual() {
    const hora = new Date().getHours();
    // Se for entre 07:00 e 18:59
    if (hora >= 7 && hora < 19) {
        return "07 x 19";
    } else {
        // Se for entre 19:00 e 06:59 (madrugada inclusa)
        return "19 x 07";
    }
}

function onSelectColab() {
  const val = document.getElementById('inv-colab').value;
  const btn = document.getElementById('btn-step1');
  if (!val) { document.getElementById('turno-row').style.display='none'; btn.disabled=true; return; }
  
  const e = APP.estoque.equipe.find(x => x.nome === val);
  if (!e) return;
  
  inv.colab = e.nome; 
  inv.turno = e.turno;
  inv.turnoHora = getTurnoAtual();
  
  document.getElementById('turno-label').textContent = `Equipe ${e.turno}`;
  document.getElementById('inv-turno-hora').value = inv.turnoHora;
  document.getElementById('turno-row').style.display = '';
  btn.disabled = false;
}

function goStep(n) {
  [1,2,3,4].forEach(i => {
      const el = document.getElementById(`step-${i}`);
      if (el) el.style.display = (i===n?'':'none');
  });
  if (n === 2) renderItens();
  if (n === 3) { setTimeout(() => { if (typeof initSignature === 'function') sig = initSignature('sig-canvas'); }, 100); }
  if (n === 4) { inv.matricula = document.getElementById('matricula').value; inv.sigData = sig?.getData() || ''; renderResumo(); }
  window.scrollTo({top: 0, behavior: 'smooth'});
}

function renderItens() {
  const items = APP.estoque.items || [];
  document.getElementById('itens-lista').innerHTML = items.map(item => {
    const qty = inv.counts[item.id];
    return `
    <div class="item-card">
      <div class="item-card-header">
        <span class="item-card-name">${item.name}</span>
        <span class="badge">${item.cat}</span>
      </div>
      <div class="item-card-body">
        <div class="qty-ctrl">
          <button class="qty-btn" onclick="adjInv(${item.id},-1)">−</button>
          <span class="qty-num" id="qn-${item.id}">${qty}</span>
          <button class="qty-btn" onclick="adjInv(${item.id},1)">+</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function adjInv(id, d) {
  inv.counts[id] = Math.max(0, (inv.counts[id] || 0) + d);
  document.getElementById('qn-' + id).textContent = inv.counts[id];
}

function renderResumo() {
  document.getElementById('resumo-content').innerHTML = `
    <div class="card">
      <h3 style="color:var(--azul);margin-bottom:15px">Resumo do Inventário</h3>
      <p><strong>Colaborador:</strong> ${inv.colab}</p>
      <p><strong>Turno Operacional:</strong> ${inv.turnoHora}</p>
      <p><strong>Data/Hora:</strong> ${inv.data} às ${inv.hora}</p>
      <hr style="margin:15px 0; border:0; border-top:1px solid #eee">
      <button class="btn btn-success btn-full" onclick="salvar()" id="btn-salvar">Confirmar e Salvar no GitHub</button>
    </div>
  `;
}

async function salvar() {
  const btn = document.getElementById('btn-salvar');
  btn.disabled = true;
  
  // Atualiza as quantidades no objeto global antes de salvar
  APP.estoque.items.forEach(i => { i.qty = inv.counts[i.id] ?? i.qty; });
  
  try {
    await APP.salvarTudo({
        data: inv.data,
        hora: inv.hora,
        colaborador: inv.colab,
        turno: inv.turnoHora,
        matricula: inv.matricula
    });
    alert('Inventário salvo com sucesso!');
    location.href = 'index.html';
  } catch (e) {
    btn.disabled = false;
    alert('Erro ao salvar no GitHub. Verifique sua conexão ou Token.');
  }
}
</script>
</body>
</html>
